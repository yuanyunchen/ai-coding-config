  <text x="66" y="432" font-size="12.5" fill="#54637F">用户序列与去重口径的基准，</text>
  <text x="66" y="452" font-size="12.5" fill="#54637F">embedding 链路的口径全部</text>
  <text x="66" y="469" font-size="12.5" fill="#54637F">对齐它的生产逻辑</text>
</g>

