  <text x="426" y="312" font-size="12.5" fill="#3A6072">RW 平 · TDP 跑 4.5 天微涨 · EU 偏负</text>
  <text x="426" y="332" font-size="12.5" fill="#3A6072">候选池取自白盒商品库；EU 偏负已定位到 search</text>
  <text x="426" y="349" font-size="12.5" fill="#3A6072">对 Pixel 的信号挤压</text>
</g>

<g>
  <rect x="406" y="380" width="380" height="96" rx="10" fill="#E4F1F7" stroke="#2C7A9B" stroke-width="1.4"/>
  <rect x="406" y="380" width="4.5" height="96" rx="2" fill="#2C7A9B"/>
  <text x="426" y="409" font-size="15" font-weight="600" fill="#14495E">C · embedding 邻近召回链路</text>
