  <text x="66" y="192" font-size="12.5" fill="#54637F">商品属性 city · SKU · geoname</text>
  <text x="66" y="213" font-size="12.5" fill="#54637F">Hotel BI 只作补充校准，</text>
  <text x="66" y="230" font-size="12.5" fill="#54637F">本周起不再当过滤器用</text>
</g>

<g>
  <rect x="48" y="260" width="250" height="96" rx="10" fill="#E1E7F5" stroke="#3B4F7D" stroke-width="2.2"/>
  <text x="66" y="289" font-size="15" font-weight="600" fill="#263352">TNT 表</text>
  <rect x="128" y="276" width="66" height="17" rx="8.5" fill="#3B4F7D"/>
  <text x="161" y="288.5" font-size="11.5" fill="#FFFFFF" text-anchor="middle">公共依赖</text>
  <text x="66" y="312" font-size="12.5" fill="#4A5A7A">Polo 生产 · T + NT 合表</text>
  <text x="66" y="331" font-size="12.5" fill="#4A5A7A">只 mask message ID / URL，</text>
  <text x="66" y="348" font-size="12.5" fill="#4A5A7A">是否另有过滤待问 owner</text>
</g>

<g>
  <rect x="48" y="380" width="250" height="96" rx="10" fill="#EAEEF7" stroke="#4A5E8C" stroke-width="1.4"/>
