<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worked example · from a cluster to a tested concept</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="pages.css">
<style>
.verdict{border:1px solid var(--line-strong);border-left:4px solid var(--faint);background:var(--panel);border-radius:8px;padding:12px 16px;margin:16px 0;max-width:900px}
.verdict.pass{border-left-color:var(--lime)}.verdict.fail{border-left-color:var(--rose)}
.verdict b{font:600 17px var(--font-ui)}.verdict.pass b{color:var(--lime)}.verdict.fail b{color:var(--rose)}
.verdict p{margin:4px 0 0;color:var(--dim);font-size:13px}
.step{font:11px var(--font-data);letter-spacing:.22em;text-transform:uppercase;color:var(--ice);margin:44px 0 0}
.kv{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.kv div{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 13px;min-width:130px}
.kv b{display:block;font:600 21px/1.15 var(--font-data)}.kv span{font-size:12px;color:var(--dim)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0 14px}
.thumbs img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:5px;border:1px solid var(--line);display:block;background:var(--well)}
.gt{font:12px var(--font-data);color:var(--dim);margin:14px 0 0}
.def{border:1px solid var(--line-strong);background:var(--panel);border-radius:8px;padding:12px 16px;max-width:820px;margin:10px 0}
.def h4{font:600 18px var(--font-ui);margin:0 0 4px}.def p{margin:0}
pre.j{font:12px/1.5 var(--font-data);background:var(--well);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-width:820px;overflow:auto;white-space:pre-wrap}
.rows{max-width:820px;margin:10px 0}
.row{display:grid;grid-template-columns:210px 1fr 190px;gap:10px;align-items:center;font-size:12.5px;padding:1px 0}
.row .n{font-family:var(--font-data);color:var(--dim);white-space:nowrap}
.row.on{background:var(--ice-soft);border-radius:4px}
.row .iv{margin:2px 0;height:14px}.row .iv u{top:5px}.row .iv s{top:2px}
@media(max-width:640px){.row{grid-template-columns:90px 1fr}.row .n{display:none}}
</style>
</head><body>
<nav id="site-nav"></nav>
<header class="pg-top"><div class="eb">Dual map · Design Arena web pages</div><button class="hbtn" id="theme">Light</button></header>
<main class="doc" id="view"></main>
<script src="case.js"></script>
<script src="nav.js"></script>
</body></html>
