<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Correspondence · concept nodes and areas of the map</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="arena.css">
<link rel="stylesheet" href="lightbox.css">
<link rel="stylesheet" href="columns.css">
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="hovercard.css">
<style>
/* Correspondence page: tokens, cards and buttons come from arena.css */
/* the page uses the window: 24 px gutters (16 on phones), no centred maximum width; running text keeps a readable measure */
.pg-more b{color:var(--starlight);font-weight:600}
.bar{display:flex;gap:var(--s8,8px) var(--s12,12px);align-items:center;flex-wrap:wrap;margin:0 0 var(--s12,12px);font-size:calc(12.5px + var(--fz));color:var(--dim)}
/* item 81, responsive (page.css frame): list | map | card fill the viewport below the header (.pg-work, height = 100dvh minus what is
   above, at least 480); columns by width with page.css's breakpoints: one column under 784 px, two (list | map, the card below) up to
   1,303, three above, and from 2,400 px the card is wider and shows its examples three across (3 x 2). Type grows gently past 1,440 px
   (--fz, at most +3 px) and the map's dots and labels grow with its drawing area (corr.js). */
:root{--fz:clamp(0px,(100vw - 1440px) * .0012,3px)}
.main{display:grid;grid-template-columns:var(--side,340px) 24px minmax(0,1fr) 24px var(--side,340px);grid-template-rows:minmax(0,1fr);gap:0;align-items:stretch;
  height:max(var(--work-min,480px),calc(100dvh - var(--work-top,280px) + 8px))}   /* the dividers are the 24 px gaps; the height restated here so the --work-top that PgFrame sets on this element applies */
.main>.card{align-self:stretch;min-height:0}
.col{padding:var(--s24,24px) 20px;min-height:0;overflow:auto}
.col h3,.sec{font:600 calc(11px + var(--fz)) var(--font-data);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:var(--s24,24px) 0 var(--s12,12px)}
.col h3:first-child{margin-top:0}
.nd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;width:100%;padding:5px 8px;border:0;border-radius:6px;background:none;color:var(--starlight);font:calc(13px + var(--fz)) var(--font-ui);text-align:left;cursor:pointer}
.nd:hover{background:var(--line-soft)}.nd.on{background:var(--ice-soft);color:var(--ice)}
.ef{font:calc(12px + var(--fz)) var(--font-data);color:var(--dim);white-space:nowrap}.ef.pos{color:var(--lime)}.ef.neg{color:var(--rose)}
.mapc{padding:20px var(--s24,24px);display:flex;flex-direction:column;min-width:0}
.mapc .cap{font-size:calc(13.5px + var(--fz));line-height:1.45;min-height:40px;color:var(--starlight);max-width:var(--measure,70ch)}
.mapc .cap b{color:var(--ice);font-weight:600}.mapc .cap small{display:block;font-size:calc(12.5px + var(--fz));color:var(--dim);margin-top:2px}
.mw{flex:1 1 auto;min-height:240px;margin-top:var(--s12,12px)}
#map{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:pointer;border-radius:6px}
.under{font-size:calc(12.5px + var(--fz));color:var(--dim);margin-top:var(--s12,12px);min-height:19px;max-width:var(--measure-title,90ch)}
.under i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 5px 0 12px;vertical-align:-1px}.under i:first-child{margin-left:0}
.side h2{font:700 calc(17px + var(--fz)) var(--font-display);margin-bottom:4px}.side h2 small{font:400 calc(12px + var(--fz)) var(--font-data);color:var(--dim)}
.side p{font-size:calc(12.5px + var(--fz));color:var(--dim);line-height:1.5;margin-top:4px}
.side a{font-size:calc(12.5px + var(--fz))}
.ar{border-top:1px solid var(--line);padding:var(--s12,12px) 0 var(--s4,4px);margin-top:var(--s12,12px)}
.ar h4{font:600 calc(13.5px + var(--fz)) var(--font-ui);cursor:pointer}.ar h4:hover{color:var(--ice)}.ar h4 small{font:400 calc(12px + var(--fz)) var(--font-data);color:var(--dim)}
.ar .m{font:calc(12px + var(--fz)) var(--font-data);color:var(--dim);margin-top:3px;line-height:1.5}
.six{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s8,8px);margin-top:var(--s12,12px)}
.six .more{position:absolute;right:6px;bottom:6px;font:600 calc(12px + var(--fz)) var(--font-ui);color:var(--starlight);background:rgba(6,9,19,.84);border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;cursor:pointer}
.six img[hidden]{display:none}
.six .more:hover,.six .more:focus-visible{border-color:var(--ice);color:var(--ice)}
.six img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:3px;background:var(--void-2)}
.split{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.split b{font:600 calc(13px + var(--fz)) var(--font-ui)}
.split .row{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.split .a{font:calc(12px + var(--fz)) var(--font-data);border:1px solid var(--line-strong);border-radius:6px;padding:3px 7px;color:var(--dim);cursor:pointer}
.split .a.cur{border-color:var(--ice)}.split .a.pos{color:var(--lime);border-color:var(--lime)}.split .a.neg{color:var(--rose);border-color:var(--rose)}
h2.t{font:700 calc(19px + var(--fz)) var(--font-display);margin:var(--s48,48px) 0 var(--s8,8px)}
p.d{font-size:calc(13px + var(--fz));color:var(--dim);line-height:1.55;max-width:var(--measure,70ch);margin-bottom:var(--s16,16px)}
.multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:var(--s12,12px)}
.mm{padding:8px;cursor:pointer;text-align:left;color:var(--starlight);font-family:var(--font-ui)}
.mm:hover,.mm.on{border-color:var(--ice)}
.mm canvas{display:block;width:100%;border-radius:4px}
.mm b{display:block;font:600 calc(12.5px + var(--fz)) var(--font-ui);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm span{display:flex;justify-content:space-between;font:calc(12px + var(--fz)) var(--font-data);color:var(--dim);margin-top:2px}
.mx{overflow:auto;padding:var(--s16,16px) 20px;max-height:720px}
.mx table{border-collapse:collapse;font:calc(12px + var(--fz)) var(--font-data)}
.mx th{position:sticky;top:-16px;background:var(--void-2);font-weight:500;color:var(--dim);padding:4px 5px;cursor:pointer;white-space:nowrap;z-index:1}
.mx th:hover,.mx th.on{color:var(--ice)}
.mx td{padding:3px 5px;text-align:center;border-top:1px solid var(--line-soft);min-width:34px;color:var(--starlight)}
.mx td.n{text-align:left;font:calc(12.5px + var(--fz)) var(--font-ui);white-space:nowrap;cursor:pointer;position:sticky;left:-20px;background:var(--void-2)}
.mx td.n:hover{color:var(--ice)}.mx tr.on td.n{color:var(--ice)}
.mx td.c{cursor:pointer}.mx td.c:hover{outline:1px solid var(--ice)}
.standin{margin:8px 8px 0 0}
/* cluster rows compact (a long name wraps instead of being cut); the panel is as tall as the window allows */
.nd.lf{align-items:center;gap:6px;padding:3px 8px;font-size:calc(12.5px + var(--fz))}
.nd.lf .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.nd.lf.bnd .nm{color:var(--dim)}.side p.aud{color:var(--starlight)}.side p.aud b{color:var(--ember);font-weight:600}.nd.lf.bnd b.ef{color:#7c869e}
.nd.lf .tgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}.nd.lf .tg{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.nd.lf b.ef{flex:none;font-weight:500;min-width:42px;text-align:right}
.tg{font:normal calc(11px + var(--fz)) var(--font-ui);color:var(--dim);border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;white-space:nowrap}.tg.bad{color:var(--ember);border-color:var(--ember)}
.lvc{display:flex;gap:var(--s8,8px);margin-bottom:var(--s12,12px)}
.lvc input,.lvc select{font:calc(12.5px + var(--fz)) var(--font-ui);color:var(--starlight);background:var(--void-2);border:1px solid var(--line-strong);border-radius:7px;padding:5px 8px;min-width:0}
.lvc input{flex:1 1 90px;min-width:90px}.lvc .pk{flex:0 1 auto;min-width:0}.lvc .pk-btn{min-width:120px}#lvK .b{padding:4px 9px;font-size:calc(12px + var(--fz));flex:1;text-align:center}.col p.none{font-size:calc(12.5px + var(--fz));color:var(--dim);padding:6px 8px}
.ef.lean,.nd.lf small b.lean{opacity:.62;border-bottom:1px dashed currentColor}
.under .tiers{display:block;margin-top:3px}.under .tiers b{color:var(--starlight);font-weight:500}
.split .a.lean{border-style:dashed;opacity:.75}
.nd.lf small{display:block;font:calc(12px + var(--fz)) var(--font-data);color:var(--dim);margin-top:2px;line-height:1.45}
.nd.lf small b{font-weight:500}.nd.lf small b.pos{color:var(--lime)}.nd.lf small b.neg{color:var(--rose)}
.nd:disabled{cursor:default;opacity:.7}
table.spec{border-collapse:collapse;font-size:calc(12.5px + var(--fz));width:100%}
table.spec td{padding:4px 0;border-top:1px solid var(--line-soft);vertical-align:top;color:var(--starlight)}
table.spec td:first-child{color:var(--dim);padding-right:12px;white-space:normal;width:38%}
.six.one{grid-template-columns:1fr}
/* directory: collapsible groups, the kind of cluster as the main heading, wins more / fewer inside */
#nodes details>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:7px}
#nodes details>summary::-webkit-details-marker{display:none}
#nodes details>summary::before{content:'▸';font-size:calc(10px + var(--fz));color:var(--faint);width:9px;flex:none}
#nodes details[open]>summary::before{content:'▾'}
#nodes summary .c{font:calc(12px + var(--fz)) var(--font-data);color:var(--dim);font-weight:400;letter-spacing:0;text-transform:none}
#nodes .gk{margin-top:6px}
#nodes .gk>summary{font:700 calc(14.5px + var(--fz)) var(--font-display);color:var(--starlight);padding:8px 4px 6px;border-bottom:1px solid var(--line-strong)}
#nodes .gk>summary:hover{color:var(--ice)}
#nodes .gs>summary{font:600 calc(11px + var(--fz)) var(--font-data);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:8px 0 3px 10px}
#nodes .gs.pos>summary{color:var(--lime)}#nodes .gs.neg>summary{color:var(--rose)}
#nodes .gs>.nd{padding-left:20px}
/* model view: the model's colour is ember everywhere on the page */
.mdl{flex:none;font:normal calc(11.5px + var(--fz)) var(--font-data);color:var(--ember);min-width:44px;text-align:right}.mdl.weak{opacity:.5}
.mw{position:relative}
.mv{position:absolute;top:8px;right:10px;font:600 calc(11.5px + var(--fz)) var(--font-ui);color:var(--void);background:var(--ember);border-radius:999px;padding:3px 10px;pointer-events:none}
.mv[hidden]{display:none}
/* hover: the slot is hoverslot.js (styles in page.css); the ring on the map */
.hring{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid var(--starlight);border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px var(--void)}.hring[hidden]{display:none}
.mapc .cap small.mline{color:var(--dim)}.mapc .cap small.mline b{color:var(--ember)}
/* example grids: four shown (2 x 2); from 2,400 px six (3 x 2); the rest only in the viewer; "+N more" names what is not shown */
.six img[data-lb]:nth-of-type(n+5){display:none}.six .m6{display:none}
#side .hslot img{max-height:min(280px,32vh)}
/* two columns: list | map at the working height, the card below across the width (its grids four across) */
@media (max-width:1303px){.main>.colsplit{display:none}
  .main{grid-template-columns:clamp(260px,32%,360px) minmax(0,1fr)!important;column-gap:var(--s24,24px);grid-template-rows:max(var(--work-min,480px),calc(100dvh - var(--work-top,280px) + 8px)) auto;height:auto!important;row-gap:var(--s24,24px)}
  .main>.side{grid-column:1/-1;max-height:80vh}
  .main>.side .six{grid-template-columns:repeat(4,1fr)}.main>.side .six.one{grid-template-columns:minmax(0,480px)}}
/* one column: list, map, card stacked */
@media (max-width:783px){.main{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto!important;row-gap:var(--s24,24px)}
  .col{max-height:420px}.mw{flex:none;height:clamp(320px,60dvh,560px)}
  .main>.side .six{grid-template-columns:repeat(2,1fr)}.main>.side .six.one{grid-template-columns:1fr}}
/* wide: the card wider, its examples three across, six shown */
@media (min-width:2400px){.main{grid-template-columns:var(--side,520px) 24px minmax(0,1fr) 24px clamp(520px,24vw,900px)}
  .six{grid-template-columns:repeat(3,1fr)}.six img[data-lb]:nth-of-type(n+5){display:block}.six img[data-lb]:nth-of-type(n+7){display:none}
  .six .m4{display:none}.six .m6{display:inline}.six.le6 .more{display:none}}
</style>
</head><body>
<nav id="site-nav"></nav>
<main class="pg-frame" id="view"></main>
<script src="columns.js"></script>
<script src="panzoom.js"></script>
<script src="hovercard.js"></script>
<script src="hoverslot.js"></script>
<script src="picker.js"></script>
<script src="corr.js"></script>
<script src="nav.js"></script>
<script src="lightbox.js"></script>
</body></html>
