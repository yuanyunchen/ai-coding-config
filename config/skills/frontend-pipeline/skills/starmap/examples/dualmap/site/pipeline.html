<style>

.q{font-size:13px;line-height:1.5;max-height:7.5em;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid var(--line-strong);padding-left:9px;color:var(--starlight)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}

.chips span.new{border-color:var(--ice);color:var(--ice)}

<nav id="site-nav"></nav>
<main class="pg-frame" id="view">
  <header class="pg-head">
    <h1 class="pg-title">Data pipeline: how a request is <em>routed through the skill</em> to a style.</h1>
    <div class="pg-note" id="pgnote"></div>
